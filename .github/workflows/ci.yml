name: Validate Sensory Atlas Prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: ESM Architecture, FAIR Schema & Brand Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run zero-dependency verification suite
        run: npm test
